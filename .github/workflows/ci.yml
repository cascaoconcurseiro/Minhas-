name: CI — Testes, Tipagem & Build (Minhas Economias BR)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Testes Unitários, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Dependências
        run: bun install --frozen-lockfile

      - name: Verificar Tipagem TypeScript (Lint)
        run: bun run lint

      - name: Executar 69 Testes Unitários (node:test)
        run: bun x tsx --test src/utils/*.test.ts

      - name: Gerar Build de Produção (Vite)
        run: bun run build

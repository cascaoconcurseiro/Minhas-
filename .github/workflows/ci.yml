name: CI — Testes, Tipagem & Build (Minhas Economias BR)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Testes Unitários, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Verificar Tipagem TypeScript (Lint)
        run: npm run lint

      - name: Executar 69 Testes Unitários (node:test)
        run: npx tsx --test src/utils/*.test.ts

      - name: Gerar Build de Produção (Vite)
        run: npm run build

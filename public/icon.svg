<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="pwa-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with Squircle / iOS shape -->
  <rect width="512" height="512" rx="112" fill="url(#pwa-grad)"/>
  
  <!-- Subtle circular grid rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Financial Emblem: Dynamic ascending arrow + Shield & Coin motif -->
  <g filter="url(#shadow)" transform="translate(106, 116)">
    <!-- Main Card / Shield silhouette -->
    <rect x="0" y="40" width="300" height="200" rx="28" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Magnetic chip / brand mark -->
    <rect x="36" y="76" width="48" height="38" rx="8" fill="#e2e8f0"/>
    <path d="M36 95 h48 M60 76 v38" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Card detail lines -->
    <rect x="36" y="148" width="120" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="36" y="172" width="70" height="10" rx="5" fill="#e2e8f0"/>
    
    <!-- Brazilian Real symbol styling -->
    <circle cx="230" cy="140" r="34" fill="url(#pwa-accent)"/>
    <text x="230" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">R$</text>
    
    <!-- Ascending Growth Trend Indicator -->
    <path d="M130 80 L195 24 L225 46 L270 0" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="270,0 248,0 270,22" fill="#10b981"/>
  </g>
</svg>
